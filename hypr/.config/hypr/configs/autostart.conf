exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = dex --autostart --environment WAYLAND
exec-once = waybar &
exec-once = hyprpaper
exec-once = hypridle &
exec-once = nm-applet --indicator &
exec-once = mako &

exec-once = $scripts/polkit.sh
exec-once = systemctl --user enable --now hyprpolkitagent.service

exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store



# Themeing
exec = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

