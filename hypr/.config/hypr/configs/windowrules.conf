# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/

# Center
windowrule = center on, match:title ^(pavucontrol)

# Float
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$ 
windowrule = float on, match:class ([Zz)oom|onedriver|onedriver-launcher)$
windowrule = float on, match:class ([Tt]hunar), match:title (File Operation Progress)
windowrule = float on, match:class ([Tt]hunar), match:title (Confirm to replace files)
windowrule = float on, match:class (xdg-desktop-portal-gtk)
windowrule = float on, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = float on, match:class (codium|codium-url-handler|VSCodium), match:title (Add Folder to Workspace)
windowrule = float on, match:class ^([Rr]ofi)$
windowrule = float on, match:class ^(eog)$
windowrule = float on, match:class (org.pulseaudio.pavucontrol)
windowrule = float on, match:class ^(nwg-look|qt5ct|qt6ct|mpv)$
windowrule = float on, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = float on, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$ # system monitor
windowrule = float on, match:class ^(yad)$ # icon browser
windowrule = float on, match:class ^(wihotspot-gui)$ # wifi hotspot
windowrule = float on, match:class ^(evince)$ # document viewer
windowrule = float on, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = float on, match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrule = float on, match:title (Kvantum Manager)

# Opacity
windowrule = opacity 0.9 0.6, match:class ^([Rr]ofi)$
windowrule = opacity 0.9 0.8, match:class ^([Tt]hunar)$
windowrule = opacity 0.8 0.6, match:class ^(pcmanfm-qt)$
windowrule = opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor)$
windowrule = opacity 0.9 0.8, match:class ^(deluge)$
windowrule = opacity 0.9 0.8, match:class ^(Alacritty)$
windowrule = opacity 0.9 0.85, match:class ^(kitty)$
windowrule = opacity 0.97 0.92, match:class ^(kitty)$, match:title (.*)(- nvim|vim|lvim)$
windowrule = opacity 0.9 0.7, match:class ^(mousepad)$
windowrule = opacity 0.9 0.7, match:class ^(VSCodium|codium-url-handler)$
windowrule = opacity 0.9 0.8, match:class ^(nwg-look|qt5ct|qt6ct|yad)$
windowrule = opacity 0.9 0.8, match:title (Kvantum Manager)
windowrule = opacity 0.9 0.7, match:class ^(com.obsproject.Studio)$
windowrule = opacity 0.9 0.7, match:class ^([Aa]udacious)$
windowrule = opacity 0.9 0.8, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.9 0.8, match:class ^(VSCode|code-url-handler)$
windowrule = opacity 0.9 0.8, match:class ^(jetbrains-studio)$ # Android Studio
windowrule = opacity 0.9 0.8, match:class ^(jetbrains-phpstorm)$ # PHPStorm
windowrule = opacity 0.94 0.86, match:class ^(discord|vesktop)$
windowrule = opacity 0.9 0.8, match:class ^(org.telegram.desktop)$
windowrule = opacity 0.94 0.86, match:class ^(gnome-disks|evince|wihotspot-gui|org.gnome.baobab|org.pwmt.zathura)$
windowrule = opacity 0.9 0.8, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
windowrule = opacity 0.82 0.75, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$
windowrule = opacity 0.9 0.8, match:class ^(xdg-desktop-portal-gtk)$ # gnome-keyring gui

# Size
windowrule = size 900 500, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor)$
windowrule = size 900 500, match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 900 500, match:title (Kvantum Manager)
windowrule = size 900 500, match:class ^(qt6ct)$
windowrule = size 900 500, match:class ^(evince|wihotspot-gui)$
windowrule = size 900 500, match:class ^(file-roller|org.gnome.FileRoller)$
windowrule = size 900 500, match:class (org.pulseaudio.pavucontrol)


# Picture-in-a-Picture (PIP)
windowrule = opacity 0.95 0.95, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$

# "Smart gaps" / "No gaps when only"
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]

    border_size = 0
    rounding = 0
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]

    border_size = 0
    rounding = 0
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
